name: 'Run unit tests.'
on:
   pull_request:
      branches:
         - main
         - 'releases/*'
   push:
      branches:
         - main
         - 'releases/*'

jobs:
   build:
      strategy:
         matrix:
            os:
               - ubuntu-latest
               - ubuntu-24.04-arm
               - windows-latest
               - windows-11-arm
               - macos-latest
         fail-fast: false
      runs-on: ${{ matrix.os }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

         - name: Set up Node.js
           uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version-file: package.json

         - name: Install and test
           run: |
              npm ci
              npm test

   bundle:
      name: Verify lib/index.js is up to date
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

         - name: Set up Node.js
           uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version-file: package.json

         - name: Rebuild bundle
           run: |
              npm ci
              npm run build

         - name: Fail if the committed bundle is stale
           run: |
              git diff --exit-code -- lib/ || {
                echo "::error::lib/ is out of date. Run 'npm run build' and commit the result."
                exit 1
              }

         - name: Fail if the bundle contains bare require() calls
           # require is undefined in an ESM bundle; see rollup.config.js.
           run: |
              if grep -nE '\brequire\(' lib/index.js; then
                echo "::error::lib/index.js contains require() calls, which fail at runtime in ESM."
                exit 1
              fi
