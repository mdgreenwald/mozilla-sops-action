name: 'CodeQL'

on:
   push:
      branches: [main]
   pull_request:
      branches: [main]
   schedule:
      - cron: '41 8 * * 4'

permissions:
   contents: read

jobs:
   analyze:
      name: Analyze
      runs-on: ubuntu-latest
      permissions:
         actions: read
         contents: read
         security-events: write

      strategy:
         fail-fast: false
         matrix:
            language: ['javascript-typescript']

      steps:
         - name: Checkout repository
           uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

         - name: Initialize CodeQL
           uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
           with:
              languages: ${{ matrix.language }}
              # lib/index.js is the generated Rollup bundle of src/ plus vendored
              # dependencies; scan the sources, not the bundle.
              config: |
                 paths-ignore:
                    - lib

         - name: Perform CodeQL Analysis
           uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
